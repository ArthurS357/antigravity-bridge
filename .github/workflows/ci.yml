name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Windows is where the bridge is developed and used (agy, %TEMP% cwd, .cmd shims);
    # Linux catches anything that only works because of Windows path/case rules.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ["22.x", "24.x"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (exactly the lockfile)
        run: npm ci

      - name: Rebuild plugin bundle from scratch
        run: npm run build:plugin

      - name: Committed bundle matches the rebuild
        run: |
          if ! git diff --exit-code --stat -- dist/server.mjs; then
            echo "::error file=dist/server.mjs::Bundle commitado está desatualizado em relação ao código-fonte ou às dependências do lockfile. Rode \`npm run build:plugin\` e commite o resultado."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      # Includes the bundle smoke test: dist/server.mjs alone in an empty dir, real MCP handshake.
      - name: Test
        run: npm test

      - name: Audit (high and above)
        run: npm audit --audit-level=high
